name: Construir y subir la imagen de Docker

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar código
        uses: actions/checkout@v4

      - name: Inicio de sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/clientes-back:latest .

      - name: Subir imagen
        run: docker push ${{ secrets.DOCKER_USERNAME }}/clientes-back:latest
